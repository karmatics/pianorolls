<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🎹 Piano Rolls Catalog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      padding: 18px 24px;
      max-width: 1400px;
      margin: 0 auto;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid #30363d;
    }
    .header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    h1 {
      font-size: 1.4rem;
      color: #00f2fe;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats {
      font-size: 0.78rem;
      color: #8b949e;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box {
      flex: 1 1 280px;
      position: relative;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #00f2fe;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="text"]:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.25);
    }
    .controls-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button {
      background: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
    }
    select:hover, button:hover {
      border-color: #00f2fe;
      color: #00f2fe;
    }
    button.active-btn {
      background: #003847;
      color: #00f2fe;
      border-color: #00f2fe;
    }

    /* Grid & List Styles */
    .catalog-container {
      display: grid;
      gap: 12px;
    }
    .catalog-container.grid-view {
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }
    .catalog-container.list-view {
      grid-template-columns: 1fr;
    }

    .card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #00f2fe;
      box-shadow: 0 4px 16px rgba(0, 242, 254, 0.15);
    }
    .catalog-container.list-view .card {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }
    .thumb-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      background: #070a13;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .catalog-container.list-view .thumb-wrap {
      width: 90px;
      height: 50px;
      aspect-ratio: auto;
      flex-shrink: 0;
    }
    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }
    .thumb-wrap:hover .thumb-img {
      transform: scale(1.05);
    }
    .play-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s ease;
      color: #fff;
      font-size: 1.8rem;
      pointer-events: none;
    }
    .thumb-wrap:hover .play-overlay {
      opacity: 1;
    }
    .placeholder-thumb {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
      border: 1px solid #30363d;
      padding: 10px;
      text-align: center;
      user-select: none;
    }
    .placeholder-thumb .ph-icon {
      font-size: 1.8rem;
      margin-bottom: 4px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
    }
    .placeholder-thumb .ph-title {
      font-size: 0.68rem;
      color: #8b949e;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.25;
    }
    .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #f0f6fc;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.35;
    }
    .meta-row {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 0.72rem;
      color: #8b949e;
      flex-wrap: wrap;
    }
    .id-tag {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 1px 6px;
      border-radius: 4px;
      color: #00f2fe;
      font-family: monospace;
    }
    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: auto;
    }
    .btn-play {
      background: #238636;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-play:hover {
      background: #2ea043;
    }
    .btn-veq {
      background: #21262d;
      color: #d2a8ff;
      border: 1px solid #8257e5;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.74rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-veq:hover {
      background: #271052;
      color: #fff;
    }
    .btn-yt {
      background: #21262d;
      color: #ff7b72;
      border: 1px solid #da3633;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      text-decoration: none;
    }
    .btn-yt:hover {
      background: #3c1418;
    }
    .live-status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fb950;
      margin-right: 4px;
    }
    #toast-msg {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #003847;
      color: #00f2fe;
      border: 1px solid #00f2fe;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: bold;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 10000;
      pointer-events: none;
    }
    #toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>🎹 Piano Rolls Standalone Catalog</h1>
      <div class="stats" id="stats">
        <span class="live-status"></span>Loading standalone piano rolls...
      </div>
    </div>
    <div class="controls-row">
      <button id="btn-toggle-view">🖼️ Grid View</button>
      <button id="btn-toggle-thumbs" class="active-btn">👁️ Thumbnails On</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search" placeholder="🔍 Search by song title or YouTube ID..." />
    </div>
    <div class="controls-row">
      <select id="filter-select">
        <option value="all">🌐 All Catalog Items</option>
        <option value="verified" selected>✅ Verified Videos</option>
      </select>
      <select id="sort-select">
        <option value="name-asc">🔤 Title (A → Z)</option>
        <option value="name-desc">🔤 Title (Z → A)</option>
        <option value="id-asc">🆔 YouTube ID</option>
      </select>
      <span id="match-count" style="font-size: 0.78rem; color: #8b949e; margin-left: 6px;"></span>
    </div>
  </div>

  <div id="catalog" class="catalog-container grid-view"></div>
  <div id="toast-msg"></div>

  <script>
    const aardvarkChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('aardvark_player_channel') : null;

    let catalogEntries = [];
    let currentView = 'grid';
    let showThumbs = true;
    let currentSort = 'name-asc';
    let currentFilter = 'verified';

    function showToast(text) {
      const el = document.getElementById('toast-msg');
      el.textContent = text;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    function playInAardvark(id, title) {
      if (aardvarkChannel) {
        aardvarkChannel.postMessage({
          type: 'PLAY_VIDEO',
          videoId: id,
          title: title || ''
        });
      }

      const playerUrl = `../AardvarkPlaylist/index.html?v=${encodeURIComponent(id)}&play=1`;
      window.open(playerUrl, 'aardvark_player');
      showToast(`▶ Sent "${title || id}" to Aardvark Player`);
    }

    window.handleThumbnailFallback = function(img, id, title) {
      const step = img.dataset.fallbackStep ? parseInt(img.dataset.fallbackStep, 10) : 0;
      if (step === 0) {
        img.dataset.fallbackStep = '1';
        img.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
      } else if (step === 1) {
        img.dataset.fallbackStep = '2';
        img.src = `https://img.youtube.com/vi/${id}/default.jpg`;
      } else {
        img.style.display = 'none';
        const parent = img.parentElement;
        if (parent && !parent.querySelector('.placeholder-thumb')) {
          const ph = document.createElement('div');
          ph.className = 'placeholder-thumb';
          ph.innerHTML = `<span class="ph-icon">🎹</span><span class="ph-title">${title}</span>`;
          parent.appendChild(ph);
        }
      }
    };

    Promise.all([
      fetch('./index.json').then(r => r.json()).catch(() => ({})),
      fetch('./file_metadata.json').then(r => r.json()).catch(() => ({}))
    ]).then(([indexData, metaData]) => {
      const knownFiles = new Set(
        Object.keys(metaData).map(k => k.replace(/^\/?pianorolls\//, '').replace(/\.txt$/, ''))
      );

      catalogEntries = Object.entries(indexData).map(([id, title]) => {
        const isYtId = /^[a-zA-Z0-9_-]{11}$/.test(id);
        const hasFile = knownFiles.size === 0 || knownFiles.has(id);
        return {
          id,
          title: (title && title !== id) ? title : id,
          isYtId,
          hasFile
        };
      });

      const statsEl = document.getElementById('stats');
      statsEl.innerHTML = `<span class="live-status"></span>Serving <strong>${catalogEntries.length}</strong> piano rolls for Aardvark Playlist`;
      render();
    }).catch(err => {
      document.getElementById('stats').textContent = 'Error loading index: ' + err.message;
    });

    const searchInput = document.getElementById('search');
    const sortSelect = document.getElementById('sort-select');
    const filterSelect = document.getElementById('filter-select');
    const viewBtn = document.getElementById('btn-toggle-view');
    const thumbsBtn = document.getElementById('btn-toggle-thumbs');
    const catalogEl = document.getElementById('catalog');
    const matchCountEl = document.getElementById('match-count');

    searchInput.addEventListener('input', () => render());
    sortSelect.addEventListener('change', e => {
      currentSort = e.target.value;
      render();
    });
    filterSelect.addEventListener('change', e => {
      currentFilter = e.target.value;
      render();
    });

    viewBtn.addEventListener('click', () => {
      currentView = currentView === 'grid' ? 'list' : 'grid';
      viewBtn.textContent = currentView === 'grid' ? '🖼️ Grid View' : '📋 List View';
      catalogEl.className = `catalog-container ${currentView}-view`;
    });

    thumbsBtn.addEventListener('click', () => {
      showThumbs = !showThumbs;
      thumbsBtn.textContent = showThumbs ? '👁️ Thumbnails On' : '👁️ Thumbnails Off';
      thumbsBtn.className = showThumbs ? 'active-btn' : '';
      render();
    });

    function getSortedEntries(list) {
      const copy = [...list];
      if (currentSort === 'name-asc') {
        copy.sort((a, b) => a.title.localeCompare(b.title));
      } else if (currentSort === 'name-desc') {
        copy.sort((a, b) => b.title.localeCompare(a.title));
      } else if (currentSort === 'id-asc') {
        copy.sort((a, b) => a.id.localeCompare(b.id));
      }
      return copy;
    }

    function render() {
      const q = searchInput.value.toLowerCase().trim();
      const filtered = catalogEntries.filter(item => {
        if (currentFilter === 'verified' && !item.isYtId) return false;
        if (!q) return true;
        return item.title.toLowerCase().includes(q) || item.id.toLowerCase().includes(q);
      });

      const sorted = getSortedEntries(filtered);
      matchCountEl.textContent = `${sorted.length} matches`;
      catalogEl.innerHTML = '';

      const toDisplay = sorted.slice(0, 150);

      toDisplay.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const escapedTitle = item.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        let thumbHtml = '';

        if (showThumbs) {
          if (item.isYtId) {
            const thumbUrl = `https://i.ytimg.com/vi/${item.id}/mqdefault.jpg`;
            thumbHtml = `
              <div class="thumb-wrap" onclick="playInAardvark('${item.id}', '${escapedTitle}')">
                <img class="thumb-img" src="${thumbUrl}" alt="${item.title}" onerror="handleThumbnailFallback(this, '${item.id}', '${escapedTitle}')" />
                <div class="play-overlay">▶</div>
              </div>
            `;
          } else {
            thumbHtml = `
              <div class="thumb-wrap" onclick="playInAardvark('${item.id}', '${escapedTitle}')">
                <div class="placeholder-thumb">
                  <span class="ph-icon">🎹</span>
                  <span class="ph-title">${item.title}</span>
                </div>
                <div class="play-overlay">▶</div>
              </div>
            `;
          }
        }

        const ytBtnHtml = item.isYtId 
          ? `<a class="btn-yt" href="https://www.youtube.com/watch?v=${item.id}" target="_blank" title="Open YouTube video">YouTube ↗</a>`
          : '';

        card.innerHTML = `
          ${thumbHtml}
          <div class="info">
            <span class="title" title="${item.title}">${item.title}</span>
            <div class="meta-row">
              <span class="id-tag">${item.id}</span>
              ${ytBtnHtml}
            </div>
          </div>
          <div class="card-actions">
            <button class="btn-play" onclick="playInAardvark('${item.id}', '${escapedTitle}')">▶ Play</button>
            <a class="btn-veq" href="./${item.id}.txt" target="_blank" title="View raw VEQ text file">📄 .txt</a>
          </div>
        `;
        catalogEl.appendChild(card);
      });

      if (sorted.length > 150) {
        const footerNotice = document.createElement('div');
        footerNotice.style.gridColumn = '1 / -1';
        footerNotice.style.textAlign = 'center';
        footerNotice.style.padding = '16px';
        footerNotice.style.color = '#8b949e';
        footerNotice.style.fontSize = '0.82rem';
        footerNotice.textContent = `Showing first 150 of ${sorted.length} results. Use search above to narrow down.`;
        catalogEl.appendChild(footerNotice);
      }
    }
  </script>
</body>
</html>
